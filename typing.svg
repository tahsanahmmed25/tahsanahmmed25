<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 65" width="750" height="65">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
    
    .term-text {
      font-family: 'Fira Code', 'Share Tech Mono', monospace;
      font-weight: 700;
      font-size: 23px;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    /* Relaxed, slower character-by-character typewriter reveal (27s total cycle) */
    .line1 { animation: type1 27s infinite; fill: #00F2FE; }
    .line2 { animation: type2 27s infinite; fill: #FF5E36; }
    .line3 { animation: type3 27s infinite; fill: #10B981; }
    .line4 { animation: type4 27s infinite; fill: #A855F7; }
    .line5 { animation: type5 27s infinite; fill: #F59E0B; }
    .line6 { animation: type6 27s infinite; fill: #EC4899; }

    @keyframes type1 {
      0% { opacity: 0; clip-path: inset(0 100% 0 0); }
      1.5% { opacity: 1; clip-path: inset(0 100% 0 0); }
      12% { opacity: 1; clip-path: inset(0 0 0 0); }
      15.5% { opacity: 1; clip-path: inset(0 0 0 0); }
      16.6% { opacity: 0; clip-path: inset(0 100% 0 0); }
      100% { opacity: 0; }
    }
    @keyframes type2 {
      0%, 16.6% { opacity: 0; clip-path: inset(0 100% 0 0); }
      18.1% { opacity: 1; clip-path: inset(0 100% 0 0); }
      28.6% { opacity: 1; clip-path: inset(0 0 0 0); }
      32.1% { opacity: 1; clip-path: inset(0 0 0 0); }
      33.3% { opacity: 0; clip-path: inset(0 100% 0 0); }
      100% { opacity: 0; }
    }
    @keyframes type3 {
      0%, 33.3% { opacity: 0; clip-path: inset(0 100% 0 0); }
      34.8% { opacity: 1; clip-path: inset(0 100% 0 0); }
      45.3% { opacity: 1; clip-path: inset(0 0 0 0); }
      48.8% { opacity: 1; clip-path: inset(0 0 0 0); }
      50% { opacity: 0; clip-path: inset(0 100% 0 0); }
      100% { opacity: 0; }
    }
    @keyframes type4 {
      0%, 50% { opacity: 0; clip-path: inset(0 100% 0 0); }
      51.5% { opacity: 1; clip-path: inset(0 100% 0 0); }
      62% { opacity: 1; clip-path: inset(0 0 0 0); }
      65.5% { opacity: 1; clip-path: inset(0 0 0 0); }
      66.6% { opacity: 0; clip-path: inset(0 100% 0 0); }
      100% { opacity: 0; }
    }
    @keyframes type5 {
      0%, 66.6% { opacity: 0; clip-path: inset(0 100% 0 0); }
      68.1% { opacity: 1; clip-path: inset(0 100% 0 0); }
      78.6% { opacity: 1; clip-path: inset(0 0 0 0); }
      82.1% { opacity: 1; clip-path: inset(0 0 0 0); }
      83.3% { opacity: 0; clip-path: inset(0 100% 0 0); }
      100% { opacity: 0; }
    }
    @keyframes type6 {
      0%, 83.3% { opacity: 0; clip-path: inset(0 100% 0 0); }
      84.8% { opacity: 1; clip-path: inset(0 100% 0 0); }
      95.3% { opacity: 1; clip-path: inset(0 0 0 0); }
      98.8% { opacity: 1; clip-path: inset(0 0 0 0); }
      100% { opacity: 0; clip-path: inset(0 100% 0 0); }
    }
  </style>

  <g class="term-text">
    <text x="50%" y="50%" class="line1">&gt; Hi there! I'm Tahsan Ahmmed 👋_</text>
    <text x="50%" y="50%" class="line2">&gt; ⚡ Pure Vibe Coder ⚡_</text>
    <text x="50%" y="50%" class="line3">&gt; 🚀 Building Cool Stuff with AI 🤖_</text>
    <text x="50%" y="50%" class="line4">&gt; 📱 Native Android &amp; Desktop Architect 💻_</text>
    <text x="50%" y="50%" class="line5">&gt; 📊 Web Analytics &amp; Growth Hacker 📈_</text>
    <text x="50%" y="50%" class="line6">&gt; ✨ Turning Ideas into Products Fast 🎯_</text>
  </g>
</svg>
