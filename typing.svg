<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 65" width="750" height="65">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
    
    .terminal-container {
      font-family: 'Fira Code', 'Share Tech Mono', monospace;
      font-weight: 700;
      font-size: 24px;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    /* Terminal Hacker Typewriter & Color Cycling */
    .line1 { animation: cycle1 16s infinite; fill: #00F2FE; }
    .line2 { animation: cycle2 16s infinite; fill: #FF5E36; }
    .line3 { animation: cycle3 16s infinite; fill: #10B981; }
    .line4 { animation: cycle4 16s infinite; fill: #A855F7; }
    .line5 { animation: cycle5 16s infinite; fill: #F59E0B; }
    .line6 { animation: cycle6 16s infinite; fill: #EC4899; }

    @keyframes cycle1 { 0%, 15% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes cycle2 { 0%, 16% { opacity: 0; } 17%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes cycle3 { 0%, 33% { opacity: 0; } 34%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes cycle4 { 0%, 50% { opacity: 0; } 51%, 66% { opacity: 1; } 67%, 100% { opacity: 0; } }
    @keyframes cycle5 { 0%, 67% { opacity: 0; } 68%, 83% { opacity: 1; } 84%, 100% { opacity: 0; } }
    @keyframes cycle6 { 0%, 84% { opacity: 0; } 85%, 99% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <g class="terminal-container">
    <text x="50%" y="50%" class="line1">&gt; Hi there! I'm Tahsan Ahmmed 👋_</text>
    <text x="50%" y="50%" class="line2">&gt; ⚡ Pure Vibe Coder ⚡_</text>
    <text x="50%" y="50%" class="line3">&gt; 🚀 Building Cool Stuff with AI 🤖_</text>
    <text x="50%" y="50%" class="line4">&gt; 📱 Native Android &amp; Desktop Architect 💻_</text>
    <text x="50%" y="50%" class="line5">&gt; 📊 Web Analytics &amp; Growth Hacker 📈_</text>
    <text x="50%" y="50%" class="line6">&gt; ✨ Turning Ideas into Products Fast 🎯_</text>
  </g>
</svg>
