<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 60" width="700" height="60">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
    
    .text-container {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 26px;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    /* Cycle through 6 distinct sentences with unique vibrant colors on a single line */
    .line1 { animation: cycle1 15s infinite; fill: #00F2FE; }
    .line2 { animation: cycle2 15s infinite; fill: #FF5E36; }
    .line3 { animation: cycle3 15s infinite; fill: #10B981; }
    .line4 { animation: cycle4 15s infinite; fill: #A855F7; }
    .line5 { animation: cycle5 15s infinite; fill: #F59E0B; }
    .line6 { animation: cycle6 15s infinite; fill: #EC4899; }

    @keyframes cycle1 { 0%, 15% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes cycle2 { 0%, 16% { opacity: 0; } 17%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes cycle3 { 0%, 33% { opacity: 0; } 34%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes cycle4 { 0%, 50% { opacity: 0; } 51%, 66% { opacity: 1; } 67%, 100% { opacity: 0; } }
    @keyframes cycle5 { 0%, 67% { opacity: 0; } 68%, 83% { opacity: 1; } 84%, 100% { opacity: 0; } }
    @keyframes cycle6 { 0%, 84% { opacity: 0; } 85%, 99% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <g class="text-container">
    <text x="50%" y="50%" class="line1">Hi there! I'm Tahsan Ahmmed 👋</text>
    <text x="50%" y="50%" class="line2">⚡ Pure Vibe Coder ⚡</text>
    <text x="50%" y="50%" class="line3">🚀 Building Cool Stuff with AI 🤖</text>
    <text x="50%" y="50%" class="line4">📱 Native Android &amp; Desktop Architect 💻</text>
    <text x="50%" y="50%" class="line5">📊 Web Analytics &amp; Growth Hacker 📈</text>
    <text x="50%" y="50%" class="line6">✨ Turning Ideas into Products Fast 🎯</text>
  </g>
</svg>
